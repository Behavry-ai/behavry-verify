name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[service,dev]"
      - run: ruff check .
      - run: pytest -q

  cli-only:
    # The offline verifier must work with `cryptography` alone. An auditor on
    # an air-gapped box installs the CLI, not the service, and this job fails
    # the moment a service-only import leaks into the verification core.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -c "from behavry_verify.cli import main; from behavry_verify.package import verify_package"
      - run: behavry-verify --help
