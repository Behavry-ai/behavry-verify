[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "behavry-verify"
version = "0.2.0"
description = "Independently verify Behavry APR evidence packages offline, with no Behavry account."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Behavry Inc." }]
keywords = ["behavry", "audit", "verification", "provenance", "ed25519", "merkle"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

# The CLI deliberately depends on `cryptography` alone. An auditor running the
# offline verifier should have as little to install, and as little to trust,
# as possible.
dependencies = ["cryptography>=42.0"]

[project.optional-dependencies]
# NOTE: Vercel's Python builder installs `[project.dependencies]` from this
# file and ignores requirements.txt. Because the service deps live in this
# extra rather than in the base list, vercel.json MUST carry
# `"installCommand": "pip install '.[service]'"`. Drop that line and the
# deployed function builds fine but 500s on every request with an ImportError
# on fastapi. Keep the two in sync.
service = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
behavry-verify = "behavry_verify.cli:main"

[project.urls]
Homepage = "https://verify.behavry.ai"
Source = "https://github.com/Behavry-ai/behavry-verify"

[tool.hatch.build.targets.wheel]
packages = ["behavry_verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
